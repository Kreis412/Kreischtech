name: ContractorSight
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  ContractorSight:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kreischtech.contractorsight
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: ContractorSight
        UILaunchScreen: {}
        NSCameraUsageDescription: Take jobsite photos to save with your field notes.
  ContractorSightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ContractorSight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ContractorSight:
    build:
      targets:
        ContractorSight: all
    test:
      targets: [ContractorSightTests]
